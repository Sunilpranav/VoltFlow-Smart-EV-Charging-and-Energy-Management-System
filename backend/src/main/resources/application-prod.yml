# ==============================================================================
# VoltFlow Production Profile (spring.profiles.active=prod)
# ==============================================================================

spring:
  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

jwt:
  secret: ${JWT_SECRET:}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://voltflow.yourdomain.com}

server:
  error:
    include-stacktrace: never
    include-message: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.voltflow: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
    org.apache.catalina: WARN
