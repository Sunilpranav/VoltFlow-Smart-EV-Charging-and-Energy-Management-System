name: VoltFlow CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests (Java 17 / Spring Boot)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Integration Tests
        working-directory: backend
        run: |
          set -o pipefail
          mvn -B clean test 2>&1 | tee mvn.log

      # Shows exactly which tests failed in the run's Annotations / Summary
      - name: Report backend failures
        if: failure()
        working-directory: backend
        run: |
          [ -f mvn.log ] || exit 0
          {
            echo '### Backend test failures'
            echo '```'
            grep -E '^\[ERROR\]' mvn.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^\[ERROR\]' mvn.log | head -15 | while IFS= read -r line; do
            echo "::error::${line}"
          done

  frontend-build:
    name: Frontend Build & Typecheck (React 19 / Vite)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Oxlint Linter
        working-directory: frontend
        run: npm run lint

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm test

      - name: Run Production Typecheck and Build
        working-directory: frontend
        run: npm run build